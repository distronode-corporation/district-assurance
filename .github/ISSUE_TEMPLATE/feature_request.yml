name: 💡 Feature request
description: Ask for something district-assurance does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/distronode-corporation/district-assurance/blob/main/ROADMAP.md) first: planned work already has an issue id there.
  - type: textarea
    id: need
    attributes:
      label: What do you need, and why?
      description: The problem you have, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: How you work around it now, if you do.
