name: 🐞 Bug report
description: Report a reproducible bug in district-assurance (not a question or a feature request).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start, please [search existing issues](https://github.com/distronode-corporation/district-assurance/issues?q=is%3Aissue):** it may already be reported or fixed.

        ⛔ **Do not report a security vulnerability here.** Report it privately through [Report a vulnerability](https://github.com/distronode-corporation/district-assurance/security/advisories/new) instead; see [SECURITY.md](https://github.com/distronode-corporation/district-assurance/blob/main/SECURITY.md).

        ⚠️ **Nothing you paste here is private.** Never paste real customer data, a real phone number, a card number, a key or a webhook secret. Use 555 numbers, `example.test` hosts and values marked "not a secret".
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release or a build of `main`.
          required: true
        - label: This is not a security vulnerability, and I've removed any real data, key or secret from everything I'm pasting.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What's the bug?
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you ran, so a maintainer can reproduce it. A failing test, or an `npm run simulate` command with its config and script, is best.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: district-assurance version or commit
      description: "`npm ls district-assurance`, or the commit of `main` you built."
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
      placeholder: Node.js 24.19.0 on Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it go wrong?
      options:
        - The core (session, state machine, policy, config)
        - Badge (verify)
        - Dossier (file)
        - Paylink (pay)
        - Trace (ledger, receipts, consent)
        - Gate or Step-up (entry)
        - district-assurance/stripe or district-assurance/carrier
        - district-assurance/testing
        - The reference server or the demo
        - The `district-assurance simulate` command
        - The documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your FlowConfig
      description: The config the flow ran with, if it matters. Read it before pasting.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: The error, the events or the `simulate` output. Optional, but it usually decides the issue.
      render: text
