name: Release

# Releases main's version, on its own, when a release pull request merges. One human gate: the
# release pull request, approved by the code owner, that sets package.json's version and dates
# its CHANGELOG.md section (README.md, "How releases work"). Every push to main runs this
# workflow; it releases only when main's package.json version has no tag `vX.Y.Z` yet and is not
# on npm, and is a no-op (success, nothing done) otherwise, so an ordinary merge changes nothing.
#
#   decide        reads main's version and decides: `release` (no tag, not on npm), `resume` (the
#                 tag is on this very commit and either the version is not on npm, or it is but
#                 the tag has no GitHub release with its files: a run that tagged, or published,
#                 and then failed), or `done` (tagged, published and released: the no-op). Anything
#                 else (a version on npm without its tag, a tag on another commit while the version
#                 is not on npm, a run off main, a commit not on main, a release with no dated
#                 CHANGELOG.md section) fails. A resume publishes nothing twice: the publish job's
#                 registry check skips the publish when npm already serves the very same bytes, and
#                 fails when it serves other bytes, before the GitHub release is made.
#   tag           `release` only: creates the annotated tag `vX.Y.Z` on this exact commit, signed
#                 with gitsign (keyless Sigstore signing under this workflow's GitHub OIDC
#                 identity, so no long-lived key exists anywhere), verifies it, and pushes it with
#                 the workflow's own token.
#   guard         fetches the tag back as the server holds it and requires it to be annotated, to
#                 name this commit, and to carry a valid gitsign signature, in the transparency
#                 log, made by this file on main of this repository (the identity README.md tells
#                 users to expect). Nothing is built or published from a tag that fails it.
#   ci            the CI workflow (ci.yml) on the commit: lint, typecheck, 100% coverage,
#                 build and demo, on every system and Node version it covers.
#   supply-chain  npm audit and osv-scanner on the lockfile (supply-chain.yml).
#   pack          requires the commit to be on main, builds and packs twice and requires
#                 the same bytes (a reproducible pack), checks the file list, and unpacks the
#                 tarball into an empty project to import and type-check its three entry points
#                 (the exports smoke test).
# Then exactly one of:
#   publish       this repository only, in the `npm-publish` environment (main only). It
#                 rebuilds, requires the pack job's SHA-256, writes and checks a CycloneDX SBOM of
#                 the published package, signs an SBOM attestation for the tarball through
#                 Sigstore, keeps the release files, and publishes that tarball. A rerun after npm
#                 accepted it publishes nothing again when the registry serves the very same
#                 bytes, and fails when it serves other bytes under the version.
#   github-release  after publish: a GitHub release on the tag with the tarball, the SBOM and
#                 the attestation's Sigstore bundle attached.
#   dry-run       a manual run with `dry_run` ticked: no tag, no signature, and the same
#                 rebuild, comparison and SBOM check, and `npm publish --dry-run` (skipped for a
#                 package.json with `"private": true`). Only the tag and publish jobs may ask for
#                 an OIDC token.
# And beside them, needed by nothing:
#   bench         the benchmarks of the previous release and of this one, one after the other on
#                 the same runner, and a case more than 20% slower reported in the run summary
#                 (BENCHMARKS.md). It never fails or holds up a release.
#
# Anyone with write access can create a `v*` tag, but a tag pushed by hand starts nothing (there
# is no tag trigger), and only a tag this file made and signed on main gets past the guard, which
# every publishing run needs: a stray tag of the version on another commit fails `decide`, and an
# unsigned one on this commit fails the guard, so neither ever ships. (A dry run skips the guard,
# builds and packs without a tag, and never publishes.) The repository's tag rules forbid moving or deleting a
# `v*` tag (an admin can bypass them). A manual run (workflow_dispatch) on main is the
# fallback when a push run did not start or failed: it decides the same way, so it releases only
# what a push run would have, and resumes a run that tagged and then failed.
#
# The `npm-publish` environment admits only main, and has no required reviewer: the release
# pull request's approval is the gate. GitHub creates an environment named by a job the first
# time that job runs, WITHOUT protection rules, so the publish job does not take the
# environment's existence on trust: its first step reads it back and stops unless its deployment
# rule admits main and nothing else, so an environment that lost or never had that rule never
# lets a publish through.
#
# What each signature covers. The tag's gitsign signature ties the version to the commit and to
# this workflow on main; `gitsign verify-tag` checks it. npm provenance (the publish step) ties
# the tarball to this commit and this workflow, and npm's registry signs it; `npm audit
# signatures` checks both. Provenance does not say what is in the package, so the SBOM
# attestation does: its subject is the tarball's SHA-256 and its predicate the SBOM, and
# `gh attestation verify` checks it. README.md ("Checking a release") gives the three commands.
#
# The package was private until the first release was decided (DECISIONS.md, ADR-12), and the
# release pull request for 0.1.0 removed `"private": true`. The publish job still fails on a
# package.json that has it, so a manifest marked private is never published.
#
# No secret and no npm token. npm's trusted publishing exchanges the job's OIDC token for a
# one-time publish credential and signs the provenance statement. It is set up on npmjs.com,
# outside this file: the package's trusted publisher is this repository, the workflow file
# `release.yml` and the environment `npm-publish`, with `npm publish` ticked as an allowed
# action: a trusted publisher created since September 2026 allows only `npm stage publish`
# until it is, and the publish step below runs `npm publish`, so without it the step fails.
# The environment, with its deployment rule of main only, is set up in the repository's
# settings.
#
# First publication: npm sets a trusted publisher only on a package that already exists, so this
# workflow cannot create the package (with no token and no trusted publisher it has no
# credential, and the publish step fails closed). The package's owner reserved the name by hand
# with a placeholder version that is not a release, the trusted publisher above was then set up,
# and every release, from 0.1.0 on, is published by this workflow. Tags up to v0.1.0 were pushed
# by hand and are not signed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: A dry run (no tag, no signature, no publish), even when the version is new.
        type: boolean
        default: false

# Read-only at the top level; each job names the scopes it needs.
permissions:
  contents: read

# One release at a time, never cancelled half way: a second push waits, then sees the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    # Upstream only: a fork's main never tags or publishes.
    if: github.repository == 'distronode-corporation/district-assurance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      state: ${{ steps.decide.outputs.state }}
      dry: ${{ steps.decide.outputs.dry }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The tag's certificate names this file on main, the identity README.md tells users to
      # expect, so a run on any other ref would sign under another identity.
      - name: Only from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::A release runs from main, not $REF."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for the check that the commit is on main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # A re-run of an old push run, or a dispatch that raced a newer push, may hold a commit main
      # has since moved past; it must still be on main.
      #
      # ⛔ EVERY GIT CALL THAT REACHES GITHUB CARRIES THE JOB'S TOKEN, as a header given to that one
      # command (`git -c http.extraheader=...`), never in a URL and never left in git's config
      # (checkout runs with persist-credentials: false). A request with no credential is refused
      # from a runner (HTTP 403, the first push release of 0.2.0), even for this public repository.
      - name: The commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The commit $GITHUB_SHA is not on main."
            exit 1
          fi
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json's version '$version' is not a release version."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          tag="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote --tags origin "refs/tags/v$version^{}" | cut -f1)"
          if [ -z "$tag" ]; then tag="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote --tags origin "refs/tags/v$version" | cut -f1)"; fi
          # The registry's own document for the package, read for the version's key: a version npm
          # does not have is a missing key, and any failure to fetch or read the document stops
          # the run (fail closed), never reads as "not published". (`npm view` exits 1 alike for
          # a missing version and for a failed request, so it cannot tell them apart.)
          curl -fsS --retry 3 -o "$RUNNER_TEMP/packument.json" https://registry.npmjs.org/district-assurance
          published="$(node -e '
            const doc = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (typeof doc.versions !== "object" || doc.versions === null) process.exit(1);
            process.stdout.write(Object.hasOwn(doc.versions, process.argv[2]) ? "yes" : "");
          ' "$RUNNER_TEMP/packument.json" "$version")"
          dry=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then dry=true; fi
          if [ -n "$tag" ] && [ -n "$published" ]; then
            state="done"
            # Tagged here and on npm: done only once the tag's GitHub release has its files. A 404
            # is "no release yet"; any other failure to ask stops the run.
            if [ "$tag" = "$GITHUB_SHA" ]; then
              complete=""
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err"; then
                # Published, with all three files the release job attaches, each fully uploaded (an
                # upload that failed can leave an asset of its name in the "starter" state): anything
                # less is repaired.
                complete="$(node -e '
                  const release = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
                  const v = process.argv[2];
                  const names = new Set((Array.isArray(release.assets) ? release.assets : []).filter((asset) => asset?.state === "uploaded").map((asset) => asset.name));
                  const files = [".tgz", ".cdx.json", ".tgz.sbom.sigstore.json"].map((suffix) => "district-assurance-" + v + suffix);
                  process.stdout.write(release.draft === false && files.every((file) => names.has(file)) ? "yes" : "");
                ' "$RUNNER_TEMP/release.json" "$version")"
              elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release.err"; then
                cat "$RUNNER_TEMP/release.err"
                echo "::error::GitHub could not be asked whether v$version has its release."
                exit 1
              fi
              if [ -z "$complete" ]; then state="resume"; fi
            fi
            if [ "$state" = "done" ]; then
              echo "v$version is tagged and released, and $version is on npm: nothing to release." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "v$version is on this commit and $version is on npm, but its GitHub release is missing: finishing it." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -n "$tag" ]; then
            if [ "$tag" != "$GITHUB_SHA" ]; then
              echo "::error::v$version is on $tag, not this commit ($GITHUB_SHA), and $version is not on npm. Re-run the run that made the tag."
              exit 1
            fi
            state="resume"
            echo "v$version is on this commit and $version is not on npm: resuming." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$published" ]; then
            echo "::error::$version is on npm but has no tag v$version: a person must look."
            exit 1
          else
            state="release"
            if ! grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section."
              exit 1
            fi
            echo "Releasing $version." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "version=$version"
            echo "state=$state"
            echo "dry=$dry"
          } >> "$GITHUB_OUTPUT"

  tag:
    needs: decide
    if: needs.decide.outputs.state == 'release' && needs.decide.outputs.dry == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the tag
      id-token: write # the OIDC token gitsign exchanges for its signing certificate
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      # The upstream release, checked against a pinned SHA-256. Move both together, and with the
      # copy in the guard job.
      GITSIGN_VERSION: 0.18.0
      GITSIGN_SHA256: 2bc625472a08fea3bb6a57982c7d8b4978d1032251d305ceef3bf2ded0ca4483
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitsign
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitsign" \
            "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  $RUNNER_TEMP/gitsign" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/gitsign" /usr/local/bin/gitsign
          gitsign --version
      # Signs this run's commit, then verifies the new tag against the identity users are told to
      # expect before anything is pushed.
      - name: Create the signed tag
        env:
          # Embeds the transparency log entry, with its inclusion proof, in the signature, so
          # verify-tag checks it there instead of searching the log, which can miss an entry made
          # seconds earlier (district-core-rust's first signed release failed that way).
          # Verification is no less strict.
          GITSIGN_REKOR_MODE: offline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config gpg.format x509
          git config gpg.x509.program gitsign
          git tag -s -m "district-assurance $VERSION" "v$VERSION" "$GITHUB_SHA"
          gitsign verify-tag "v$VERSION" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # The workflow's own token pushes it. The repository's tag rules forbid moving or deleting a
      # `v*` tag once it exists, so this push is the tag's one write.
      - name: Push the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push origin "refs/tags/v$VERSION"

  # ⛔ ONLY A TAG THIS WORKFLOW SIGNED IS RELEASED. Everything after it needs this job.
  guard:
    needs: [decide, tag]
    if: >-
      ${{ always() && needs.decide.result == 'success' && needs.decide.outputs.dry == 'false' &&
        (needs.decide.outputs.state == 'resume' ||
        (needs.decide.outputs.state == 'release' && needs.tag.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      # The same pin as the tag job's. Move both together.
      GITSIGN_VERSION: 0.18.0
      GITSIGN_SHA256: 2bc625472a08fea3bb6a57982c7d8b4978d1032251d305ceef3bf2ded0ca4483
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitsign
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitsign" \
            "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  $RUNNER_TEMP/gitsign" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/gitsign" /usr/local/bin/gitsign
          gitsign --version
      # The tag object is fetched as the server holds it, so the check reads the annotated, signed
      # tag that was pushed and not a local copy. A lightweight tag, a tag on another commit, an
      # unsigned tag, or one signed by anyone or anything else stops the release here.
      - name: The tag is signed by this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "+refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          if [ "$(git cat-file -t "refs/tags/v${VERSION}")" != "tag" ]; then
            echo "::error::v$VERSION is a lightweight tag; a release tag is annotated and signed by this workflow"
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION does not name $GITHUB_SHA, the commit this run checked out"
            exit 1
          fi
          gitsign verify-tag "v$VERSION" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  ci:
    needs: [decide, guard]
    if: >-
      ${{ always() && needs.decide.result == 'success' &&
        (needs.decide.outputs.state != 'done' || needs.decide.outputs.dry == 'true') &&
        (needs.guard.result == 'success' || (needs.decide.outputs.dry == 'true' && needs.guard.result == 'skipped')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  supply-chain:
    needs: [decide, guard]
    if: >-
      ${{ always() && needs.decide.result == 'success' &&
        (needs.decide.outputs.state != 'done' || needs.decide.outputs.dry == 'true') &&
        (needs.guard.result == 'success' || (needs.decide.outputs.dry == 'true' && needs.guard.result == 'skipped')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/supply-chain.yml # zizmor: ignore[self-repository]

  pack:
    needs: [decide, guard]
    if: >-
      ${{ always() && needs.decide.result == 'success' &&
        (needs.decide.outputs.state != 'done' || needs.decide.outputs.dry == 'true') &&
        (needs.guard.result == 'success' || (needs.decide.outputs.dry == 'true' && needs.guard.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ref.outputs.version }}
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for the check that the commit is on main.
          fetch-depth: 0
      # No package-manager cache anywhere in this file: a restored cache is one more input to
      # what gets published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The version the decide job read, read again from this checkout of the same commit.
      - name: package.json's version is the one decided
        id: ref
        env:
          DECIDED: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$DECIDED" ]; then
            echo "::error::package.json's version $version is not the decided $DECIDED."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Only a commit already on main is released.
      - name: The commit is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The commit $GITHUB_SHA is not on main."
            exit 1
          fi
      # Development dependencies only (the package has no runtime dependency), with no install
      # scripts: nothing runs before the build but the compiler.
      - run: npm ci --ignore-scripts
      # Two clean builds, two packs, one set of bytes. npm fixes every file's time and mode in
      # the tarball, so the bytes depend only on the files; a difference means the build is not
      # deterministic and nothing is published. The publish job repeats this on a fresh runner
      # and must reach the same SHA-256.
      - name: Reproducible pack
        id: pack
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          file="district-assurance-$VERSION.tgz"
          for n in 1 2; do
            npm run build
            mkdir -p "$RUNNER_TEMP/pack-$n"
            npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack-$n"
          done
          first="$(sha256sum "$RUNNER_TEMP/pack-1/$file" | cut -d' ' -f1)"
          second="$(sha256sum "$RUNNER_TEMP/pack-2/$file" | cut -d' ' -f1)"
          if [ "$first" != "$second" ]; then
            echo "::error::Two builds of the same commit packed differently ($first, $second)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/pack-1/$file" "$RUNNER_TEMP/release/$file"
          echo "filename=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$first" >> "$GITHUB_OUTPUT"
          echo "$file SHA-256 $first" >> "$GITHUB_STEP_SUMMARY"
      # Only the compiled entry points, the FlowConfig schema and the documents `files` names: no
      # source, test, example or configuration file, and every entry point present.
      - name: Tarball contents
        env:
          FILE: ${{ steps.pack.outputs.filename }}
        run: |
          set -euo pipefail
          tar -tzf "$RUNNER_TEMP/release/$FILE" | sort > "$RUNNER_TEMP/contents.txt"
          cat "$RUNNER_TEMP/contents.txt"
          allowed='^package/(dist/.+\.(js|d\.ts)|schema/[a-z0-9.-]+\.json|package\.json|README\.md|SECURITY-MODEL\.md|SECURITY\.md|SPEC\.md|CHANGELOG\.md|LICENSE|NOTICE)$'
          if grep -vE "$allowed" "$RUNNER_TEMP/contents.txt"; then
            echo "::error::The tarball holds files outside the published set (above)."
            exit 1
          fi
          for required in package/dist/index.js package/dist/index.d.ts package/dist/testing/index.js \
            package/dist/testing/index.d.ts package/dist/stripe/index.js package/dist/stripe/index.d.ts \
            package/dist/carrier/index.js package/dist/carrier/index.d.ts package/schema/flow-config.v1.json \
            package/package.json package/LICENSE package/NOTICE; do
            grep -qxF "$required" "$RUNNER_TEMP/contents.txt" || { echo "::error::$required is missing."; exit 1; }
          done
      # The tarball unpacked into an empty project's node_modules, as an install lays it out
      # (the package has no dependency, so there is nothing else to install and no registry
      # call). The two entry points and
      # package.json import, a path inside dist/ is refused, the testing entry builds an engine,
      # and a strict TypeScript consumer type-checks against the published declarations, the
      # library's own included (skipLibCheck is off).
      - name: Exports smoke test
        env:
          FILE: ${{ steps.pack.outputs.filename }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          cd "$smoke"
          printf '{ "name": "smoke", "private": true, "type": "module" }\n' > package.json
          mkdir -p node_modules/district-assurance
          tar -xzf "$RUNNER_TEMP/release/$FILE" -C node_modules/district-assurance --strip-components=1
          cat > smoke.mjs <<'EOF'
          import assert from "node:assert/strict";
          import * as root from "district-assurance";
          import * as testing from "district-assurance/testing";
          import * as stripe from "district-assurance/stripe";
          import * as carrier from "district-assurance/carrier";
          import pkg from "district-assurance/package.json" with { type: "json" };

          assert.equal(pkg.version, process.argv[2]);
          for (const name of ["createEngine", "validateConfig", "verifyReceipt", "verifyStripeSignature", "findCardNumbers"]) {
            assert.equal(typeof root[name], "function", `district-assurance exports ${name}`);
          }
          for (const name of ["createTestEngine", "sessionStoreContract"]) {
            assert.equal(typeof testing[name], "function", `district-assurance/testing exports ${name}`);
          }
          for (const name of ["StripeCheckoutLinks", "fetchStripeClient", "assertStripeKey", "verifyConnectEvent", "connectAccountCreateParams"]) {
            assert.equal(typeof stripe[name], "function", `district-assurance/stripe exports ${name}`);
          }
          for (const name of ["twilioSimSwapHours", "telnyxPortHours", "durationHours"]) {
            assert.equal(typeof carrier[name], "function", `district-assurance/carrier exports ${name}`);
          }
          // Only the published entry points are public: a path inside dist/ is refused.
          await assert.rejects(import("district-assurance/dist/index.js"), { code: "ERR_PACKAGE_PATH_NOT_EXPORTED" });
          // The testing entry builds a working engine from the published files alone.
          const { engine } = testing.createTestEngine();
          assert.equal(typeof engine.startCall, "function");
          console.log(`district-assurance ${pkg.version}: ${Object.keys(root).length} root exports, ${Object.keys(testing).length} testing exports`);
          EOF
          node smoke.mjs "$VERSION"
          cat > smoke-types.ts <<'EOF'
          import { createEngine, type Engine } from "district-assurance";
          import { createTestEngine, sessionStoreContract } from "district-assurance/testing";
          import { StripeCheckoutLinks, type StripeClientLike } from "district-assurance/stripe";
          import { twilioSimSwapHours } from "district-assurance/carrier";

          const engine: Engine = createTestEngine().engine;
          export const links = (client: StripeClientLike) => new StripeCheckoutLinks(client, { mode: "test", successUrl: "https://example.com/" });
          export const checks = [createEngine, sessionStoreContract, engine, twilioSimSwapHours] as const;
          EOF
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --exactOptionalPropertyTypes \
            --target es2024 --lib es2024 --module nodenext --moduleResolution nodenext \
            --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" --types node smoke-types.ts
      # The exact tarball, for anyone to compare with the registry's copy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.filename }}
          path: ${{ runner.temp }}/release/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [decide, guard, ci, supply-chain, pack]
    # Upstream only, so a fork never tries, and only after the guard passed on this workflow's own
    # signed tag and every check passed: a dry run never publishes.
    if: >-
      ${{ always() && github.repository == 'distronode-corporation/district-assurance' &&
        needs.decide.outputs.dry == 'false' && needs.guard.result == 'success' &&
        needs.ci.result == 'success' && needs.supply-chain.result == 'success' && needs.pack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment the trusted publisher is bound to. It admits only main and has no required
    # reviewer: the code-owner-approved release pull request is the human gate (SECURITY-MODEL.md,
    # "Supply chain and releases").
    environment: npm-publish
    permissions:
      contents: read
      # Trusted publishing, the provenance statement and the SBOM attestation's signing
      # certificate. Only this job holds it, and its steps run only the pinned actions in
      # this file and the repository's own build, install scripts off.
      id-token: write
      # Stores the SBOM attestation in this repository, where `gh attestation verify` finds it.
      attestations: write
      # Reads the npm-publish environment's deployment rules back (the first step).
      actions: read
    steps:
      # Audit, not block, until the first real publish: its audit log gives the endpoint list, and
      # the policy switches to block with that list before the second publish (SECURITY-MODEL.md).
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The environment is only as good as its rules, and an environment GitHub created on first use
      # has none. Fails closed: a deployment rule that admits anything but main (or nothing at
      # all), or no answer from the API, and nothing is published.
      - name: The npm-publish environment admits only main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/npm-publish" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/npm-publish/deployment-branch-policies" > "$RUNNER_TEMP/policies.json"
          node -e '
            const read = (file) => JSON.parse(require("node:fs").readFileSync(file, "utf8"));
            const env = read(process.argv[1]);
            const policies = read(process.argv[2]).branch_policies;
            const custom = env.deployment_branch_policy?.custom_branch_policies === true && env.deployment_branch_policy?.protected_branches === false;
            const mainOnly = Array.isArray(policies) && policies.length === 1 && policies[0]?.type === "branch" && policies[0]?.name === "main";
            if (!custom || !mainOnly) {
              console.log("::error::The npm-publish environment must admit main only (one custom branch rule, main) before anything is published.");
              process.exit(1);
            }
            console.log("npm-publish: deployments from main only");
          ' "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/policies.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # registry-url as npm's trusted publishing guide has it. No cache, as everywhere here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # The bytes published are rebuilt here, on a fresh runner, and must be the bytes the pack
      # job checked and smoke-tested. No artifact passes between the jobs.
      - name: Rebuild and compare with the pack job
        env:
          FILE: ${{ needs.pack.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          npm run build
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          actual="$(sha256sum "$RUNNER_TEMP/release/$FILE" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::The rebuilt tarball ($actual) differs from the one the pack job checked ($EXPECTED_SHA256)."
            exit 1
          fi
      - name: The package is not private
        run: |
          set -euo pipefail
          if [ "$(node -p 'require("./package.json").private === true')" = "true" ]; then
            echo "::error::package.json has \"private\": true (ADR-12). Remove it in the pull request that decides the first release."
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm is new enough for trusted publishing
        run: |
          set -euo pipefail
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is older than 11.5.1."; exit 1; }
      # The published package's components, from the tagged package.json and lockfile with the
      # development tools left out. The package has no runtime dependency, so the package
      # itself is the only thing the SBOM names; one that names more stops the release.
      - name: CycloneDX SBOM
        id: sbom
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          sbom="$RUNNER_TEMP/release/district-assurance-$VERSION.cdx.json"
          npm sbom --sbom-format cyclonedx --sbom-type library --omit dev > "$sbom"
          cat > "$RUNNER_TEMP/sbom-check.mjs" <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const [file, version] = process.argv.slice(2);
          const bom = JSON.parse(readFileSync(file, "utf8"));
          assert.equal(bom.bomFormat, "CycloneDX");
          // The purl, not `name`: npm sbom names the root component after the checkout's folder.
          assert.equal(bom.metadata.component.purl, `pkg:npm/district-assurance@${version}`);
          assert.deepEqual(bom.components ?? [], [], "The published package has a runtime dependency.");
          console.log(`CycloneDX ${bom.specVersion} SBOM of district-assurance ${version}: no runtime dependency`);
          EOF
          node "$RUNNER_TEMP/sbom-check.mjs" "$sbom" "$VERSION"
          echo "path=$sbom" >> "$GITHUB_OUTPUT"
      # Signed before the package is published, so a published version always has one. The
      # subject is the tarball's SHA-256, the bytes the registry serves.
      - name: SBOM attestation
        id: attest
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/release/${{ needs.pack.outputs.filename }}
          sbom-path: ${{ steps.sbom.outputs.path }}
      # The files the github-release job attaches, kept before anything is published: a run whose
      # publish went through always has them. It gets no OIDC token and this job gets no write
      # access to the repository's contents. A rerun replaces the first attempt's files.
      - name: Collect the release files
        env:
          FILE: ${{ needs.pack.outputs.filename }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/release/$FILE.sbom.sigstore.json"
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.pack.outputs.version }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      # Whether the registry already has this version (a rerun after npm accepted it, when a later
      # step failed). Not there: publish. There with these very bytes (npm's sha512 integrity):
      # publish nothing again. There with other bytes, or no answer from the registry: fail.
      - name: Registry check
        id: registry
        env:
          FILE: ${{ needs.pack.outputs.filename }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          integrity="$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); console.log("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$RUNNER_TEMP/release/$FILE")"
          if published="$(npm view "district-assurance@$VERSION" dist.integrity 2> "$RUNNER_TEMP/npm-view.err")"; then
            :
          elif grep -q 'E404' "$RUNNER_TEMP/npm-view.err"; then
            published=""
          else
            cat "$RUNNER_TEMP/npm-view.err"
            echo "::error::The registry could not be asked whether district-assurance $VERSION is published."
            exit 1
          fi
          if [ -z "$published" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$published" = "$integrity" ]; then
            echo "district-assurance $VERSION is already published with these bytes ($integrity): not publishing again." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::district-assurance $VERSION is already published with other bytes ($published, not $integrity)."
            exit 1
          fi
      # A version with a pre-release part goes to the `next` dist-tag, never to `latest`.
      - name: npm publish
        if: steps.registry.outputs.publish == 'true'
        env:
          FILE: ${{ needs.pack.outputs.filename }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "$RUNNER_TEMP/release/$FILE" --provenance --access public --tag "$tag" --ignore-scripts

  # The tag's GitHub release, with what was published and signed. A separate job so that
  # `contents: write` and `id-token: write` are never held together.
  github-release:
    needs: [pack, publish]
    if: ${{ always() && needs.publish.result == 'success' && needs.pack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Creates the release and uploads its files.
      contents: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.pack.outputs.version }}
          path: ${{ runner.temp }}/release
      # The attached tarball must be the one the pack job checked; the SBOM and the bundle are
      # checked by anyone with `gh attestation verify`, which needs no trust in this job.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ needs.pack.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          actual="$(sha256sum "$FILE" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::The tarball to attach ($actual) differs from the one the pack job checked ($EXPECTED_SHA256)."
            exit 1
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          cat > notes.md <<EOF
          district-assurance $VERSION, published to npm with provenance.

          | File | |
          |---|---|
          | \`$FILE\` | the published tarball, SHA-256 \`$actual\` |
          | \`district-assurance-$VERSION.cdx.json\` | its CycloneDX SBOM |
          | \`$FILE.sbom.sigstore.json\` | the SBOM attestation's Sigstore bundle |

          To check this release, see "Checking a release" in README.md.
          EOF
          files=("$FILE" "district-assurance-$VERSION.cdx.json" "$FILE.sbom.sigstore.json")
          # `${prerelease[@]+...}`: an empty array under `set -u` is an unbound variable in bash 3.2.
          # A resumed release may find the tag's release already there (a run that made it and
          # then failed, or a draft): it then gets the same three files, replacing any copy, and is
          # published. Only "not found" creates one; any other failure to ask stops the job.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft > /dev/null 2> view.err; then
            gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --notes-file notes.md --draft=false ${prerelease[@]+"${prerelease[@]}"}
          elif grep -qi 'release not found' view.err; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "v$VERSION" --notes-file notes.md ${prerelease[@]+"${prerelease[@]}"} "${files[@]}"
          else
            cat view.err
            echo "::error::GitHub could not be asked whether v$VERSION has a release."
            exit 1
          fi

  dry-run:
    needs: [decide, ci, supply-chain, pack]
    # A manual run with `dry_run` ticked: no tag, nothing signed, nothing published.
    if: >-
      ${{ always() && needs.decide.outputs.dry == 'true' &&
        needs.ci.result == 'success' && needs.supply-chain.result == 'success' && needs.pack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # The same rebuild and comparison as the publish job.
      - name: Rebuild and compare with the pack job
        env:
          FILE: ${{ needs.pack.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          npm run build
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          actual="$(sha256sum "$RUNNER_TEMP/release/$FILE" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::The rebuilt tarball ($actual) differs from the one the pack job checked ($EXPECTED_SHA256)."
            exit 1
          fi
      # The publish job's SBOM and check, unsigned: this job has no OIDC token. The SBOM is
      # kept with the run, so a dry run in a fork shows what a release would attest.
      - name: CycloneDX SBOM
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          sbom="$RUNNER_TEMP/release/district-assurance-$VERSION.cdx.json"
          npm sbom --sbom-format cyclonedx --sbom-type library --omit dev > "$sbom"
          cat > "$RUNNER_TEMP/sbom-check.mjs" <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const [file, version] = process.argv.slice(2);
          const bom = JSON.parse(readFileSync(file, "utf8"));
          assert.equal(bom.bomFormat, "CycloneDX");
          // The purl, not `name`: npm sbom names the root component after the checkout's folder.
          assert.equal(bom.metadata.component.purl, `pkg:npm/district-assurance@${version}`);
          assert.deepEqual(bom.components ?? [], [], "The published package has a runtime dependency.");
          console.log(`CycloneDX ${bom.specVersion} SBOM of district-assurance ${version}: no runtime dependency`);
          EOF
          node "$RUNNER_TEMP/sbom-check.mjs" "$sbom" "$VERSION"
          echo "Dry run: the SBOM was written and checked; the publish job would sign an attestation for it." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-sbom-${{ needs.pack.outputs.version }}
          path: ${{ runner.temp }}/release/district-assurance-${{ needs.pack.outputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 30
      # Whether the registry already has this version (a rerun after npm accepted it, when a later
      # step failed). Not there: publish. There with these very bytes (npm's sha512 integrity):
      # publish nothing again. There with other bytes, or no answer from the registry: fail.
      - name: Registry check
        id: registry
        env:
          FILE: ${{ needs.pack.outputs.filename }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          integrity="$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); console.log("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$RUNNER_TEMP/release/$FILE")"
          if published="$(npm view "district-assurance@$VERSION" dist.integrity 2> "$RUNNER_TEMP/npm-view.err")"; then
            :
          elif grep -q 'E404' "$RUNNER_TEMP/npm-view.err"; then
            published=""
          else
            cat "$RUNNER_TEMP/npm-view.err"
            echo "::error::The registry could not be asked whether district-assurance $VERSION is published."
            exit 1
          fi
          if [ -z "$published" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$published" = "$integrity" ]; then
            echo "district-assurance $VERSION is already published with these bytes ($integrity): not publishing again." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::district-assurance $VERSION is already published with other bytes ($published, not $integrity)."
            exit 1
          fi
      # A package.json marked private (ADR-12) would stop a real run at the publish job's
      # private check, so for one the dry run ends at the comparison above and says so.
      - name: npm publish --dry-run
        if: steps.registry.outputs.publish == 'true'
        env:
          FILE: ${{ needs.pack.outputs.filename }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$(node -p 'require("./package.json").private === true')" = "true" ]; then
            echo "package.json is private (ADR-12): a real run would stop here. Nothing was published." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "$RUNNER_TEMP/release/$FILE" --dry-run --access public --tag "$tag" --ignore-scripts
          echo "Dry run: $FILE was not published." >> "$GITHUB_STEP_SUMMARY"

  # The engine's costs against the previous release's (SRV-10). Both releases are measured here,
  # one after the other on this one runner, so the two runs share a runner type, a machine and a
  # Node version. A case more than 20% slower is reported in the run summary and as a warning.
  # Shared runners are noisy, so one run never fails a release: no job needs this one, and it
  # continues on error. The benchmarks import only the sources and Node, so there is no install.
  bench:
    needs: [decide, guard]
    if: >-
      ${{ always() && needs.decide.result == 'success' &&
        (needs.decide.outputs.state != 'done' || needs.decide.outputs.dry == 'true') &&
        (needs.guard.result == 'success' || (needs.decide.outputs.dry == 'true' && needs.guard.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    env:
      BENCH_RUNNER: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The whole history and its tags, to find and check out the previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The nearest version tag below this one (a pre-release sorts before its release) that has a
      # published GitHub release with its files: a tag pushed only for a dry run is no baseline.
      # Asked of GitHub's API, so the job needs no registry access. None: nothing is compared.
      - name: The previous release
        id: previous
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The version's own tag marks where to start, so it is made here, in this runner's clone
          # only and never pushed, when it does not exist yet (a dry run of a new version).
          git tag "v$VERSION" HEAD > /dev/null 2>&1 || true
          previous=""
          found=false
          for tag in $(git -c versionsort.suffix=- tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname); do
            if [ "$found" = true ]; then
              released="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '(.isDraft | not) and (.assets | length > 0)' 2> /dev/null || echo false)"
              if [ "$released" = "true" ]; then previous="$tag"; break; fi
              echo "$tag has no published GitHub release with its files: not a baseline."
            fi
            if [ "$tag" = "v$VERSION" ]; then found=true; fi
          done
          echo "Previous release: ${previous:-none}"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
          if [ -z "$previous" ]; then
            echo "No earlier tag has a published GitHub release with its files: the benchmarks are not compared." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The previous release's own benchmark code on its own sources. A release from before
      # benchmarks has none, and the comparison says so.
      - name: Benchmarks, previous release
        if: steps.previous.outputs.tag != ''
        env:
          TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/previous" "$TAG"
          if [ -f "$RUNNER_TEMP/previous/bench/main.ts" ]; then
            cd "$RUNNER_TEMP/previous"
            node bench/main.ts --out "$RUNNER_TEMP/bench-previous.json"
          else
            echo "$TAG has no benchmarks."
          fi
      - name: Benchmarks, this release
        run: node bench/main.ts --out "$RUNNER_TEMP/bench-current.json"
      - name: Compare with the previous release
        if: steps.previous.outputs.tag != ''
        run: node bench/compare.ts "$RUNNER_TEMP/bench-previous.json" "$RUNNER_TEMP/bench-current.json"
      # Both result files (CPU, system, Node version and commit inside), kept with the run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: ${{ runner.temp }}/bench-*.json
          if-no-files-found: warn
          retention-days: 90
