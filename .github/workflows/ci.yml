name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the same required checks on the queued commit.
  merge_group:
    types: [checks_requested]
  # release.yml runs this on the tag, as the gate before a publish.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        # "24.2" is the floor `engines` names (the first Node 24 with import.meta.main, which the
        # demo uses); 24 is the latest of the line. 3 systems x 2 = 6 jobs.
        node: ["24.2", 24]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # oxlint's correctness rules (.oxlintrc.json), warnings included.
      - run: npm run lint
      # Every tracked file against .editorconfig. Linux only (a Windows checkout may have CRLF
      # line endings). The binary is the upstream release checked against a pinned SHA-256.
      - name: EditorConfig
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          EC_VERSION: 4.0.2
          EC_SHA256: 44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/editorconfig-checker.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/editorconfig-checker-linux-amd64.tar.gz"
          echo "${EC_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/editorconfig-checker"
          tar -xzf "$archive" -C "$RUNNER_TEMP/editorconfig-checker" editorconfig-checker
          "$RUNNER_TEMP/editorconfig-checker/editorconfig-checker" -format github-actions
      # No em dashes in any tracked text file (the house style for public repositories).
      - name: No em dashes
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI $'\xe2\x80\x94' -- . ':!package-lock.json'; then
            echo "::error::em dash found; use a colon, a comma or two sentences."
            exit 1
          fi
      - run: npm run typecheck
      # 100% lines, statements, functions and branches in every file under src/, each file on
      # its own (c8, .c8rc.json). A file no test loads counts, at 0%. The reference server under
      # examples/ is tested by the same run but not held to the bar.
      - run: npm run test:coverage
      - run: npm run build
      # The scripted call, end to end, on fake adapters and a loopback server.
      - run: npm run demo
      # The audit pack (SRV-8): every test and the coverage gate again, the contract suites on
      # their own, a CycloneDX SBOM and the documents, in .tmp/audit-pack with SHA256SUMS. It fails
      # when any of them does. Built once, on Linux and the latest Node 24.
      - name: Audit pack
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: node scripts/audit-pack.mjs
